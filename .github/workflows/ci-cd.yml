name: CI/CD

on:
  push:
    branches: [main, feature/laravel-core-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Laravel checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, zip
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=${{ github.workspace }}/database/database.sqlite|' .env
          touch database/database.sqlite
          php artisan key:generate --force

      - name: Validate Laravel runtime
        run: |
          php artisan --version
          php artisan route:list --except-vendor
          php artisan schedule:list

      - name: Migrate and seed
        run: |
          php artisan migrate:fresh --seed --force

      - name: Run tests
        run: php artisan test --no-coverage

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

  deliver:
    name: Build delivery artifact
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite, zip
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Setup Node.js and build assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Create delivery bundle
        run: |
          rm -rf database/database.sqlite storage/framework/cache/data/*
          tar --exclude=.git --exclude=.env --exclude=node_modules -czf l10-${{ github.sha }}.tar.gz .

      - name: Upload delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: l10-${{ github.sha }}
          path: l10-${{ github.sha }}.tar.gz
          if-no-files-found: error
